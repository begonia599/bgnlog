<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="海棠小栈 — 思考、记录、分享" />
    <title>海棠小栈</title>

    <!-- Open Graph / 社交分享卡片。__OG_ORIGIN__ 由后端按请求 Host 注入为绝对来源
         (如 https://example.com);未注入时(开发环境)爬虫不会访问,无影响。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="海棠小栈" />
    <meta property="og:title" content="海棠小栈" />
    <meta property="og:description" content="海棠小栈 — 思考、记录、分享" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="__OG_ORIGIN__/" />
    <meta property="og:image" content="__OG_ORIGIN__/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="海棠小栈" />
    <meta name="twitter:description" content="海棠小栈 — 思考、记录、分享" />
    <meta name="twitter:image" content="__OG_ORIGIN__/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
